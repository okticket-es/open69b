service: 'open69b'
frameworkVersion: '4'
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  memorySize: 512
  timeout: 300
  httpApi:
    cors: true
  environment:
    APP_NAME: ${env:APP_NAME, 'open69b'}
    APP_VERSION: ${env:APP_VERSION, '1.1.1'}
    API_KEY: ${env:API_KEY, ''}
    # producción: ElastiCache (Fn::GetAtt), local: usa .env
    REDIS_HOST:
      Fn::GetAtt: [RedisCluster, RedisEndpoint.Address]
    REDIS_PORT:
      Fn::GetAtt: [RedisCluster, RedisEndpoint.Port]
    S3_BUCKET: ${self:custom.backupBucket}
    S3_REGION: ${self:provider.region}
    SAT_CSV_URL: ${env:SAT_CSV_URL, 'https://wu1agsprosta001.blob.core.windows.net/agsc-publicaciones/Datos_abiertos/Documents_AGAFF/Listado_completo_69-B.csv'}
    # a nivel provider (no solo en art69Sync): la función sat69b también lee
    # la tabla desde /status/{rfc}?asOf= — sin esto dependería del default
    # hardcodeado del código, que solo coincide por casualidad en prod
    ART69_TABLE_NAME: open69b-art69-${self:provider.stage}
  vpc:
    securityGroupIds:
      - Ref: LambdaSecurityGroup
    subnetIds:
      - Ref: PrivateSubnet1
      - Ref: PrivateSubnet2
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:custom.backupBucket}
            - arn:aws:s3:::${self:custom.backupBucket}/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::GetAtt: [Art69Table, Arn]

plugins:
  - serverless-domain-manager
  - serverless-offline

custom:
  backupBucket: open69b-backups-${self:provider.stage}
  customDomain:
    domainName: 69b.okticket.io
    certificateArn: arn:aws:acm:us-east-1:340917389686:certificate/b7d3b007-eb16-4a7e-9b2a-f7bcb250f2fc
    basePath: ''
    endpointType: regional
    apiType: http
    createRoute53Record: true
    autoDomain: true
  serverless-offline:
    httpPort: ${env:APP_PORT, '3000'}
    lambdaPort: ${env:LAMBDA_PORT, '3002'}
    host: 0.0.0.0
    noPrependStageInUrl: true
    useChildProcesses: true

functions:
  sat69b:
    handler: src/handlers/api.handler
    events:
      - httpApi:
          path: /status/{rfc}
          method: GET
      - httpApi:
          path: /metadata
          method: GET
      - httpApi:
          path: /sync
          method: POST
      - httpApi:
          path: /health
          method: GET
      - schedule:
          name: sat69b-daily-sync
          description: 'Sync SAT 69-B list daily at 3:00 AM UTC'
          rate: cron(0 3 * * ? *)
          enabled: true

  # artículo 69 (OKT-18900 Fase 2): función propia, no comparte memoria/timeout
  # con sat69b — descarga 14 listas (~90MB) y hace BatchGet+merge+BatchWrite
  # por RFC (para no perder entradas de "estado" cuando el RFC sale de la
  # lista). Memoria: el primer sync real (602k RFCs) picó a ~1240MB medidos;
  # 2048 da margen frente al crecimiento de las listas del SAT. Timeout al
  # máximo permitido; solo corre ~minutos una vez al día.
  art69Sync:
    handler: src/handlers/art69SyncHandler.handler
    memorySize: 2048
    timeout: 900
    events:
      - httpApi:
          path: /art69/sync
          method: POST
      - schedule:
          name: art69-daily-sync
          description: 'Sync de las 14 listas del articulo 69 CFF, diario a las 4:00 AM UTC'
          rate: cron(0 4 * * ? *)
          enabled: true

resources:
  Resources:
    # vpc
    VPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/16
        EnableDnsHostnames: true
        EnableDnsSupport: true
        Tags:
          - Key: Name
            Value: ${self:service}-vpc

    # internet gateway (para NAT)
    InternetGateway:
      Type: AWS::EC2::InternetGateway
      Properties:
        Tags:
          - Key: Name
            Value: ${self:service}-igw

    VPCGatewayAttachment:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId:
          Ref: VPC
        InternetGatewayId:
          Ref: InternetGateway

    # subnet pública (para NAT Gateway)
    PublicSubnet:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId:
          Ref: VPC
        CidrBlock: 10.0.0.0/24
        AvailabilityZone: ${self:provider.region}a
        MapPublicIpOnLaunch: true
        Tags:
          - Key: Name
            Value: ${self:service}-public-subnet

    # subnets privadas (para Lambda y ElastiCache)
    PrivateSubnet1:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId:
          Ref: VPC
        CidrBlock: 10.0.1.0/24
        AvailabilityZone: ${self:provider.region}a
        Tags:
          - Key: Name
            Value: ${self:service}-private-subnet-1

    PrivateSubnet2:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId:
          Ref: VPC
        CidrBlock: 10.0.2.0/24
        AvailabilityZone: ${self:provider.region}b
        Tags:
          - Key: Name
            Value: ${self:service}-private-subnet-2

    # elastic IP para NAT Gateway
    NatEIP:
      Type: AWS::EC2::EIP
      DependsOn: VPCGatewayAttachment
      Properties:
        Domain: vpc
        Tags:
          - Key: Name
            Value: ${self:service}-nat-eip

    # NAT Gateway (permite a Lambda acceder a internet)
    NatGateway:
      Type: AWS::EC2::NatGateway
      Properties:
        AllocationId:
          Fn::GetAtt: [NatEIP, AllocationId]
        SubnetId:
          Ref: PublicSubnet
        Tags:
          - Key: Name
            Value: ${self:service}-nat

    # route tables
    PublicRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId:
          Ref: VPC
        Tags:
          - Key: Name
            Value: ${self:service}-public-rt

    PublicRoute:
      Type: AWS::EC2::Route
      DependsOn: VPCGatewayAttachment
      Properties:
        RouteTableId:
          Ref: PublicRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId:
          Ref: InternetGateway

    PublicSubnetRouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId:
          Ref: PublicSubnet
        RouteTableId:
          Ref: PublicRouteTable

    PrivateRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId:
          Ref: VPC
        Tags:
          - Key: Name
            Value: ${self:service}-private-rt

    PrivateRoute:
      Type: AWS::EC2::Route
      Properties:
        RouteTableId:
          Ref: PrivateRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        NatGatewayId:
          Ref: NatGateway

    PrivateSubnet1RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId:
          Ref: PrivateSubnet1
        RouteTableId:
          Ref: PrivateRouteTable

    PrivateSubnet2RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId:
          Ref: PrivateSubnet2
        RouteTableId:
          Ref: PrivateRouteTable

    # security groups
    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for Lambda functions
        VpcId:
          Ref: VPC
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0
        Tags:
          - Key: Name
            Value: ${self:service}-lambda-sg

    RedisSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for Redis cluster
        VpcId:
          Ref: VPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6379
            SourceSecurityGroupId:
              Ref: LambdaSecurityGroup
        Tags:
          - Key: Name
            Value: ${self:service}-redis-sg

    # elasticache redis
    RedisSubnetGroup:
      Type: AWS::ElastiCache::SubnetGroup
      Properties:
        Description: Subnet group for Redis cluster
        SubnetIds:
          - Ref: PrivateSubnet1
          - Ref: PrivateSubnet2

    RedisCluster:
      Type: AWS::ElastiCache::CacheCluster
      Properties:
        CacheNodeType: cache.t4g.micro
        Engine: redis
        EngineVersion: '7.1'
        NumCacheNodes: 1
        CacheSubnetGroupName:
          Ref: RedisSubnetGroup
        VpcSecurityGroupIds:
          - Ref: RedisSecurityGroup
        Tags:
          - Key: Name
            Value: ${self:service}-redis

    # s3 bucket para backups. Los snapshots del artículo 69 (prefijo
    # snapshots/, sin regla de expiración) son la base del diff de salidas
    # y de la auditoría — NO deben caducar como los backups/ de 30 días.
    BackupBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: ${self:custom.backupBucket}
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldBackups
              Status: Enabled
              Prefix: backups/
              ExpirationInDays: 30
            # esta regla existe en el bucket REAL (añadida fuera de CFN, id y
            # valores verificados con get-bucket-lifecycle-configuration):
            # declararla aquí evita que el update del lifecycle la borre
            - Id: AbortIncompleteMultipartUpload
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7

    # timeline por RFC del artículo 69 (OKT-18900 Fase 2): un item por RFC
    # con todas sus entries entre las 14 listas. On-demand: el volumen de
    # escritura es un pico diario, no un tráfico sostenido.
    # Gateway Endpoints (gratis) para DynamoDB y S3: sin ellos, todo el
    # tráfico de art69Sync (~600k GetItem/BatchWrite) y de los backups del
    # 69-B sale por el único NatGateway hacia el endpoint público, con más
    # latencia y compitiendo por el mismo recurso con el sync del 69-B.
    DynamoDBVPCEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId:
          Ref: VPC
        ServiceName: !Sub com.amazonaws.${self:provider.region}.dynamodb
        VpcEndpointType: Gateway
        RouteTableIds:
          - Ref: PrivateRouteTable

    S3VPCEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId:
          Ref: VPC
        ServiceName: !Sub com.amazonaws.${self:provider.region}.s3
        VpcEndpointType: Gateway
        RouteTableIds:
          - Ref: PrivateRouteTable

    # Retain: la tabla acumula el histórico de salidas inferidas por diff,
    # que es IRRECONSTRUIBLE (el SAT no lo publica) — no debe borrarse con
    # el stack. Nota operativa: si el PRIMER deploy hiciera rollback, habría
    # que borrar a mano la tabla vacía retenida antes de reintentar.
    Art69Table:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: open69b-art69-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: rfc
            AttributeType: S
        KeySchema:
          - AttributeName: rfc
            KeyType: HASH

    # alarma de frescura: el sync loguea "SAT_DATA_STALE" cuando el corte
    # de datos del SAT supera los 90 días (habría cazado el espejo congelado)
    StaleDataMetricFilter:
      Type: AWS::Logs::MetricFilter
      DependsOn: Sat69bLogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}-sat69b
        FilterPattern: '"SAT_DATA_STALE"'
        MetricTransformations:
          - MetricName: Sat69bStaleData
            MetricNamespace: open69b
            MetricValue: '1'
            DefaultValue: 0

    # el sync del artículo 69 emite "ART69_SYNC_FAILED lists=N" cuando alguna
    # de las 14 listas falla — mismo patrón que SAT_DATA_STALE: sin esto, un
    # sync fallando a diario sería invisible (como lo fue el espejo congelado)
    Art69SyncFailedMetricFilter:
      Type: AWS::Logs::MetricFilter
      DependsOn: Art69SyncLogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}-art69Sync
        FilterPattern: '"ART69_SYNC_FAILED"'
        MetricTransformations:
          - MetricName: Art69SyncFailed
            MetricNamespace: open69b
            MetricValue: '1'
            DefaultValue: 0

    Art69SyncFailedAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-art69-sync-failed
        AlarmDescription: Alguna de las 14 listas del articulo 69 esta fallando en el sync diario
        Namespace: open69b
        MetricName: Art69SyncFailed
        Statistic: Sum
        Period: 86400
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    # sin AlarmActions: el canal de aviso (SNS/Slack) se decide con el equipo;
    # mientras tanto la alarma es visible en la consola de CloudWatch
    StaleDataAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-sat-data-stale
        AlarmDescription: El corte de datos del CSV 69-B del SAT supera los 90 dias
        Namespace: open69b
        MetricName: Sat69bStaleData
        Statistic: Sum
        Period: 86400
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

  Outputs:
    RedisEndpoint:
      Description: Redis cluster endpoint
      Value:
        Fn::GetAtt: [RedisCluster, RedisEndpoint.Address]
    VpcId:
      Description: VPC ID
      Value:
        Ref: VPC

package:
  patterns:
    - '!./**'
    - 'src/**'

build:
  esbuild:
    format: esm
    platform: node
    bundle: true
    banner:
      js: "import { createRequire } from 'module'; const require = createRequire(import.meta.url);"
    external:
      - '@miermontoto/config'
      - '@miermontoto/lambda-handler'
      - '@miermontoto/lambda-responses'
      - '@miermontoto/redis'
      - '@miermontoto/s3'
